<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  
<div class="container-fluid mt-3">
  	<div class="row">
    	<div class="bg-primary col-12">Navbar</div>
	</div>
    <div class="row">
    	<div class="bg-secondary col-4">Izq</div>
        <div class="bg-warning col-8">Der</div>
	</div>
    <div class="row">
    	<div class="bg-danger col-3">Izq</div>
        <div class="bg-secondary col-3">Izq-Centro</div>
        <div class="bg-danger col-3">Der-Centro</div>
        <div class="bg-primary col-3">Der-Centro</div>
	</div>
    <div class="row">
    	<div class="bg-warning col-4">Izq</div>
        <div class="bg-primary col-4">Centro</div>
        <div class="bg-secondary col-4">Der</div>
	</div>
    <div class="row">
    	<div class="bg-danger col-12">Centro</div>
	</div>
    <div class="row">
    	<div class="bg-primary col-6">Izq</div>
        <div class="bg-secondary col-6">Der</div>
	</div>
</div>

</body>
</html>
